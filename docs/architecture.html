<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-issue-bot 架构画布</title>
<style>
  :root{
    --bg:#f3f5f7;
    --line:#e1e5e9;
    --ink:#15181c;
    --ink2:#4c5560;
    --ink3:#818b96;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"SFMono-Regular",Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:13px;line-height:1.6;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  .bar{
    position:fixed;left:0;right:0;top:0;height:50px;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:0 18px;background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar-l{display:flex;align-items:center;gap:12px;min-width:0}
  .bar-l .mark{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3)}
  .bar-l h1{margin:0;font-size:14px;font-weight:640;letter-spacing:-.01em;white-space:nowrap}
  .ver{font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}

  .bar-r{display:flex;align-items:center;gap:6px}
  .btn{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink2);
    height:28px;min-width:28px;padding:0 9px;border-radius:6px;cursor:pointer;
    font-family:var(--sans);font-size:12px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .btn:hover{background:#f6f7f9;color:var(--ink);border-color:#cfd5db}
  .btn:active{transform:translateY(.5px)}
  .zoom{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:44px;text-align:center}

  #stage{
    position:fixed;left:0;right:0;top:50px;bottom:44px;overflow:hidden;
    cursor:grab;background-color:#f3f5f7;
    background-image:radial-gradient(#d5dbe1 1px,transparent 1px);
    background-size:22px 22px;
  }
  #stage.dragging{cursor:grabbing}
  #canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #canvas svg{display:block}

  .zone{cursor:pointer}
  .zone .frame{transition:fill .15s ease,stroke .15s ease}
  .zone:hover .frame{filter:drop-shadow(0 2px 10px rgba(20,30,45,.10))}
  .zone.on .frame{stroke-width:2.6}

  .status{
    position:fixed;left:0;right:0;bottom:0;height:44px;z-index:10;
    display:flex;align-items:center;gap:14px;padding:0 18px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);font-size:12px;color:var(--ink3);
    white-space:nowrap;overflow:hidden;
  }
  .status .k{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);
    border:1px solid var(--line);border-radius:4px;padding:1px 6px;flex:none;
  }
  .status .v{color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
  .status .v b{color:var(--ink);font-weight:620}
  .status .v i{font-style:normal;color:var(--ink3);margin:0 6px}
  .legend{display:flex;align-items:center;gap:14px;margin-left:auto;flex:none}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:11.5px}
  .lg{display:inline-block;width:22px;height:0;border-top-width:2px;border-top-style:solid}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-l">
    <span class="mark">ARCH / PI-ISSUE-BOT</span>
    <h1>Issue 处理平台架构画布</h1>
    <span class="ver">L0 大架构 · v3 · 2026-11-12</span>
  </div>
  <div class="bar-r">
    <button class="btn" id="zout" title="缩小">−</button>
    <span class="zoom" id="zlbl">100%</span>
    <button class="btn" id="zin" title="放大">+</button>
    <button class="btn" id="reset" title="复位视图">复位</button>
  </div>
</div>

<div id="stage">
  <div id="canvas">
    <svg id="arch" width="1660" height="1000" viewBox="0 0 1660 1000"
         xmlns="http://www.w3.org/2000/svg"
         font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
      <defs>
        <marker id="mFlow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
        </marker>
        <marker id="mBack" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
        </marker>
        <marker id="mObs" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#0b7d70"/>
        </marker>
        <marker id="mCfg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
        </marker>
        <marker id="mMini" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#aeb6bf"/>
        </marker>
      </defs>

      <!-- ================= 大分割：GitHub ================= -->
      <g class="zone" transform="translate(0,-40)" data-z="GitHub 平台 · 事件源与写回终点"
         data-in="人的操作：建 issue、评论、打标、关单；以及平台写回的评论与标签"
         data-do="产生 webhook 事件；承载写回结果；作为代码与讨论的事实源"
         data-out="issues.* / issue_comment.* / pull_request.* 事件流">
        <rect class="frame" x="40" y="100" width="270" height="880" rx="16" fill="#f1f3f5" stroke="#24292f" stroke-width="1.6"/>

        <rect x="40" y="100" width="270" height="58" rx="16" fill="#e8eaed"/>
        <rect x="40" y="140" width="270" height="18" fill="#e8eaed"/>
        <line x1="40" y1="158" x2="310" y2="158" stroke="#24292f" stroke-opacity=".25"/>

        <text x="60" y="128" font-size="15.5" font-weight="650" fill="#15181c">GitHub</text>
        <text x="60" y="146" font-size="10.5" fill="#5b6470">平台 A · 事件源与写回终点</text>

        <!-- Issue -->
        <g>
          <rect x="56" y="176" width="238" height="72" rx="8" fill="#fff" stroke="#cfd4da"/>
          <rect x="56" y="176" width="3" height="72" rx="1.5" fill="#24292f"/>
          <text x="72" y="197" font-size="12.5" font-weight="620" fill="#15181c">Issue</text>
          <text x="72" y="214" font-size="10" fill="#6b7480">正文 · 评论 · 标签 · 状态</text>
          <text x="72" y="231" font-size="10" fill="#818b96" font-family="SFMono-Regular,Consolas,monospace">repo + number</text>
        </g>

        <!-- PR -->
        <g>
          <rect x="56" y="258" width="238" height="60" rx="8" fill="#fff" stroke="#cfd4da"/>
          <text x="72" y="279" font-size="12.5" font-weight="620" fill="#15181c">Pull Request</text>
          <text x="72" y="296" font-size="10" fill="#6b7480">独立会话域，与 issue 隔离</text>
          <text x="72" y="311" font-size="9.5" fill="#818b96">代码评审走这条线</text>
        </g>

        <!-- Webhook -->
        <g>
          <rect x="56" y="328" width="238" height="94" rx="8" fill="#fff" stroke="#24292f" stroke-width="1.6"/>
          <rect x="56" y="328" width="3" height="94" rx="1.5" fill="#24292f"/>
          <text x="72" y="349" font-size="12.5" font-weight="620" fill="#15181c">Webhook 投递</text>
          <text x="72" y="366" font-size="10" fill="#6b7480">event + action + payload</text>
          <text x="72" y="382" font-size="9.5" fill="#6b7480" font-family="SFMono-Regular,Consolas,monospace">X-Hub-Signature-256</text>
          <text x="72" y="398" font-size="9.5" fill="#818b96">重投是常态，不是异常</text>
          <text x="72" y="414" font-size="9.5" font-weight="600" fill="#2f6fed">→ 事件流入平台</text>
        </g>

        <!-- App -->
        <g>
          <rect x="56" y="432" width="238" height="60" rx="8" fill="#fff" stroke="#cfd4da"/>
          <text x="72" y="453" font-size="12.5" font-weight="620" fill="#15181c">GitHub App</text>
          <text x="72" y="470" font-size="10" fill="#6b7480">installation token（1h 过期）</text>
          <text x="72" y="485" font-size="9.5" fill="#818b96">权限最小化，不合并 PR</text>
        </g>

        <!-- 写回 -->
        <g>
          <rect x="56" y="502" width="238" height="76" rx="8" fill="#fff" stroke="#cfd4da"/>
          <rect x="56" y="502" width="3" height="76" rx="1.5" fill="#24292f"/>
          <text x="72" y="523" font-size="12.5" font-weight="620" fill="#15181c">写回目标</text>
          <text x="72" y="540" font-size="10" fill="#6b7480">评论 · 打标 · 建 issue · 开 PR</text>
          <text x="72" y="557" font-size="9.5" fill="#818b96">分支保护强制人工 review</text>
          <text x="72" y="572" font-size="9.5" font-weight="600" fill="#5b6470">← 平台写回</text>
        </g>

        <!-- 仓库配置 -->
        <g>
          <rect x="56" y="588" width="238" height="64" rx="8" fill="#fff" stroke="#cfd4da" stroke-dasharray="4 3"/>
          <text x="72" y="609" font-size="12" font-weight="620" fill="#15181c">仓库配置</text>
          <text x="72" y="626" font-size="9.5" fill="#6b7480" font-family="SFMono-Regular,Consolas,monospace">.github/pi-bot.yml</text>
          <text x="72" y="642" font-size="9.5" fill="#818b96">项目级配置的载体</text>
        </g>

        <!-- 规模边界 -->
        <g>
          <rect x="56" y="662" width="238" height="112" rx="8" fill="#fff" stroke="#cfd4da"/>
          <text x="72" y="683" font-size="12" font-weight="620" fill="#15181c">适用边界</text>
          <text x="72" y="702" font-size="9.5" fill="#6b7480">· 单组织，少量仓库</text>
          <text x="72" y="720" font-size="9.5" fill="#6b7480">· 单机部署，不引中间件</text>
          <text x="72" y="738" font-size="9.5" fill="#6b7480">· &lt; 100 事件/天</text>
          <text x="72" y="756" font-size="9.5" fill="#6b7480">· 2–4 并发</text>
        </g>

        <g>
          <rect x="56" y="830" width="238" height="84" rx="8" fill="#fff" stroke="#cfd4da"/>
          <text x="72" y="851" font-size="12" font-weight="620" fill="#15181c">事件类型</text>
          <text x="72" y="870" font-size="8.5" fill="#4c5560" font-family="SFMono-Regular,Consolas,monospace">issues.*</text>
          <text x="72" y="886" font-size="8.5" fill="#4c5560" font-family="SFMono-Regular,Consolas,monospace">issue_comment.created</text>
          <text x="72" y="902" font-size="8.5" fill="#4c5560" font-family="SFMono-Regular,Consolas,monospace">pull_request.* / installation.*</text>
        </g>
      </g>

      <!-- ================= 大分割：平台 ================= -->
      <rect class="frame" x="350" y="60" width="1270" height="880" rx="16" fill="#fbfcfd" stroke="#9aa3ad" stroke-width="1.6"/>
      <rect x="350" y="60" width="1270" height="64" rx="16" fill="#e9edf1"/>
      <rect x="350" y="104" width="1270" height="20" fill="#e9edf1"/>
      <line x1="350" y1="124" x2="1620" y2="124" stroke="#9aa3ad" stroke-opacity=".55"/>

      <text x="372" y="88" font-size="16" font-weight="660" fill="#15181c">Issue 处理平台</text>
      <text x="372" y="108" font-size="11" fill="#4c5560">平台 B · 一个 issue 一个会话，四个部件分工</text>
      <text x="1600" y="96" text-anchor="end" font-size="9.5" fill="#818b96">PLATFORM B</text>

      <!-- 内部四块：配置 -->
      <g class="zone" data-z="配置 · 平台级 + 项目级"
         data-in="平台运维参数；每个仓库独立的项目配置"
         data-do="项目级定：agent 系统提示词、并发限额、事件开关与模板、评论关键词与角色、标签目录；平台级只管模型与 bot"
         data-out="事件开关与闸门 → 调度；模板与占位符 → 调度（由调度渲染）">
        <rect class="frame" x="374" y="142" width="270" height="778" rx="12" fill="#eff2f5" stroke="#5b6470" stroke-width="1.4"/>
        <rect x="374" y="142" width="3" height="778" rx="1.5" fill="#5b6470"/>

        <text x="392" y="170" font-size="14.5" font-weight="650" fill="#15181c">配置</text>
        <text x="392" y="188" font-size="10" fill="#5b6470">平台级默认 · 项目级覆盖</text>

        <!-- 平台级 -->
        <g>
          <rect x="390" y="202" width="238" height="148" rx="8" fill="#fff" stroke="#c9d0d7"/>
          <text x="404" y="221" font-size="10.5" font-weight="620" fill="#15181c">平台级配置</text>
          <text x="614" y="221" text-anchor="end" font-size="8.5" fill="#818b96">GLOBAL</text>
          <text x="404" y="243" font-size="9.5" fill="#4c5560">模型端点 · 地址与密钥</text>
          <text x="404" y="263" font-size="9.5" fill="#4c5560">模型名 · 调用参数</text>
          <text x="404" y="283" font-size="9.5" fill="#4c5560">bot 身份 · 句柄</text>
          <text x="404" y="303" font-size="9.5" fill="#4c5560">App 凭证</text>
          <line x1="404" y1="314" x2="614" y2="314" stroke="#eef1f4"/>
          <text x="404" y="332" font-size="9" fill="#818b96">平台级只有这两组</text>
          <text x="404" y="344" font-size="9" fill="#818b96">其余全部在项目级</text>
        </g>

        <!-- 项目级矩阵 -->
        <g>
          <rect x="390" y="362" width="238" height="186" rx="8" fill="#fff" stroke="#5b6470" stroke-width="1.4"/>
          <text x="404" y="381" font-size="10.5" font-weight="620" fill="#15181c">项目级 · 事件触发</text>
          <text x="614" y="381" text-anchor="end" font-size="8.5" fill="#818b96">PER REPO</text>

          <g font-family="SFMono-Regular,Consolas,monospace" font-size="8.5" fill="#4c5560">
            <text x="404" y="403">issues.opened</text>
            <text x="404" y="427">issues.edited</text>
            <text x="404" y="451">issues.labeled</text>
            <text x="404" y="475">issues.closed</text>
            <text x="404" y="499">issue_comment.created</text>
          </g>

          <g font-size="8.5">
            <rect x="541" y="392" width="28" height="14" rx="7" fill="#e7f5ec" stroke="#b9e0c9"/>
            <text x="555" y="402.5" text-anchor="middle" fill="#1a6b45">触发</text>
            <rect x="573" y="392" width="28" height="14" rx="7" fill="#eef1f5" stroke="#d5dbe1"/>
            <text x="587" y="402.5" text-anchor="middle" fill="#4c5560">模板</text>

            <rect x="541" y="416" width="28" height="14" rx="7" fill="#e7f5ec" stroke="#b9e0c9"/>
            <text x="555" y="426.5" text-anchor="middle" fill="#1a6b45">触发</text>
            <rect x="573" y="416" width="28" height="14" rx="7" fill="#eef1f5" stroke="#d5dbe1"/>
            <text x="587" y="426.5" text-anchor="middle" fill="#4c5560">模板</text>

            <rect x="541" y="440" width="28" height="14" rx="7" fill="#faf4e6" stroke="#e8d5a8"/>
            <text x="555" y="450.5" text-anchor="middle" fill="#8a5a12">条件</text>
            <rect x="573" y="440" width="28" height="14" rx="7" fill="#eef1f5" stroke="#d5dbe1"/>
            <text x="587" y="450.5" text-anchor="middle" fill="#4c5560">模板</text>

            <rect x="541" y="464" width="28" height="14" rx="7" fill="#eef1f5" stroke="#d5dbe1"/>
            <text x="555" y="474.5" text-anchor="middle" fill="#4c5560">关闭</text>
            <rect x="573" y="464" width="28" height="14" rx="7" fill="#eef1f5" stroke="#d5dbe1"/>
            <text x="587" y="474.5" text-anchor="middle" fill="#7d8792">—</text>

            <rect x="541" y="488" width="28" height="14" rx="7" fill="#fdf0e8" stroke="#ecccb8"/>
            <text x="555" y="498.5" text-anchor="middle" fill="#9a4b1e">额外</text>
            <rect x="573" y="488" width="28" height="14" rx="7" fill="#eef1f5" stroke="#d5dbe1"/>
            <text x="587" y="498.5" text-anchor="middle" fill="#4c5560">模板</text>
          </g>

          <line x1="404" y1="512" x2="614" y2="512" stroke="#eef1f4"/>
          <text x="404" y="529" font-size="9" fill="#818b96">每事件：开关与模板分别配</text>
          <text x="404" y="541" font-size="9" fill="#818b96">条件类如「标签命中才触发」</text>
        </g>

        <!-- 评论闸门 -->
        <g>
          <rect x="390" y="560" width="238" height="146" rx="8" fill="#fff" stroke="#d8a15c" stroke-width="1.3"/>
          <text x="404" y="579" font-size="10.5" font-weight="620" fill="#15181c">评论额外闸门</text>
          <text x="404" y="594" font-size="8.5" fill="#818b96">仅 issue_comment.created</text>

          <g font-size="9.5" fill="#4c5560">
            <rect x="404" y="604" width="8" height="8" rx="2" fill="#fff" stroke="#9aa3ad"/>
            <text x="418" y="612">是否提及才触发（@关键词 + 空格）</text>

            <text x="418" y="632">是否限定角色（选项目角色）</text>

            <rect x="404" y="684" width="8" height="8" rx="2" fill="#fff" stroke="#9aa3ad"/>
            <text x="418" y="692" fill="#818b96">关键词与角色在项目级定义</text>
          </g>
        </g>

        <!-- 继承 -->
        <g>
          <rect x="390" y="718" width="238" height="84" rx="8" fill="#fff" stroke="#c9d0d7" stroke-dasharray="4 3"/>
          <text x="404" y="737" font-size="10.5" font-weight="620" fill="#15181c">项目级 · 其他</text>
          <text x="404" y="756" font-size="9.5" fill="#4c5560">agent 系统提示词</text>
          <text x="404" y="774" font-size="9.5" fill="#4c5560">并发 · 日配额 · 超时</text>
          <text x="404" y="792" font-size="9.5" fill="#4c5560">数据保留 90 天</text>
        </g>

        <text x="390" y="836" font-size="9" fill="#5b6470">未配置回落到内置默认</text>
        <text x="390" y="850" font-size="9" fill="#5b6470">项目配置整体覆盖</text>
      </g>

      <!-- 内部四块：调度 -->
      <g class="zone" data-z="调度 · 从事件到会话"
         data-in="GitHub 事件流；配置块下发的事件开关、闸门与提示词模板"
         data-do="验签去重 → 触发判定 → 查 issue 与 session 的映射 → 事件排队（同 issue 串行）→ 渲染提示词 → 驱动一个 turn"
         data-out="发给 agent 的提示词；写回 GitHub 的动作；判定与调度轨迹">
        <rect class="frame" x="680" y="142" width="270" height="778" rx="12" fill="#eef3fe" stroke="#2f6fed" stroke-width="1.4"/>
        <rect x="680" y="142" width="3" height="778" rx="1.5" fill="#2f6fed"/>

        <text x="698" y="170" font-size="14.5" font-weight="650" fill="#16337a">调度</text>
        <text x="698" y="188" font-size="10" fill="#4d6aa5">从事件到会话的唯一协调者</text>

        <g>
          <rect x="696" y="202" width="238" height="86" rx="8" fill="#fff" stroke="#c3d4f7"/>

    <span><i class="lg" style="border-color:#5b6470;border-top-style:dashed"></i>配置</span>
    <span><i class="lg" style="border-color:#24292f;border-top-style:dashed"></i>写回</span>
    <span><i class="lg" style="border-color:#0b7d70;border-top-style:dotted"></i>记录</span>
  </div>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('canvas');
  var zlbl = document.getElementById('zlbl');
  var sk = document.getElementById('sk');
  var sv = document.getElementById('sv');

  var W = 1660, H = 1000;
  var tx = 0, ty = 0, s = 1;
  var MIN = 0.35, MAX = 2.2;

  function apply(){
    canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    zlbl.textContent = Math.round(s * 100) + '%';
  }
  function fit(){
    var r = stage.getBoundingClientRect();
    var k = Math.min((r.width - 60) / W, (r.height - 40) / H, 1);
    s = k;
    tx = (r.width - W * k) / 2;
    ty = (r.height - H * k) / 2;
    apply();
  }
  function zoomAt(cx, cy, factor){
    var ns = Math.max(MIN, Math.min(MAX, s * factor));
    if (ns === s) return;
    tx = cx - (cx - tx) * (ns / s);
    ty = cy - (cy - ty) * (ns / s);
    s = ns;
    apply();
  }

  var down = false, lastX = 0, lastY = 0, moved = false;
  stage.addEventListener('mousedown', function(e){
    if (e.button !== 0) return;
    down = true; moved = false; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('dragging');
  });
  window.addEventListener('mousemove', function(e){
    if (!down) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  window.addEventListener('mouseup', function(){
    down = false; stage.classList.remove('dragging');
  });

  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.pow(0.9988, e.deltaY));
  }, { passive: false });

  document.getElementById('zin').addEventListener('click', function(){
    var r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1.2);
  });
  document.getElementById('zout').addEventListener('click', function(){
    var r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1/1.2);
  });
  document.getElementById('reset').addEventListener('click', fit);
  stage.addEventListener('dblclick', fit);

  var zones = Array.prototype.slice.call(document.querySelectorAll('.zone'));
  zones.forEach(function(z){
    z.addEventListener('click', function(){
      if (moved) return;
      var on = z.classList.contains('on');
      zones.forEach(function(o){ o.classList.remove('on'); });
      if (on){
        sk.textContent = '视图';
        sv.textContent = '拖拽平移 · 滚轮缩放 · 双击复位 · 点击区域查看该区的输入与输出';
        return;
      }
      z.classList.add('on');
      sk.textContent = z.getAttribute('data-z');
      sv.innerHTML = '<b>输入</b> ' + z.getAttribute('data-in') +
                     ' <i>|</i> <b>处理</b> ' + z.getAttribute('data-do') +
                     ' <i>|</i> <b>输出</b> ' + z.getAttribute('data-out');
    });
  });

  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>

# 仓库配置示例（字段清单）
#
# 注意：**这个文件不在运行时读取**。多仓库改造后 `.github/pi-bot.yml` 整体退役
# （`docs/impl-multi-repo.md` §0.2）：配置只存在于 `repos.settings`（jsonb，面板写入），
# 新建仓库时由部署默认 `PI_BOT_DEFAULT_SETTINGS` seed 一份（那个环境变量吃的是 **JSON**）。
# 这里保留一份 YAML 只是为了人读字段清单，CI 用 `repoSettingsSchema` 校验它别写错
# （`apps/server/test/skills-registry.test.ts`）。
#
# 三条要点写在这里，改配置的人不必去翻文档：
#   1. `labels.map` 的**值必须是仓库里已经存在的标签**（tech-plan R4：沿用现有标签，不发明新的）；
#      某个判定键没映射，就降级为「只判定不打标」并记 warn。
#   2. `dry_run: true` 是默认值，也是首周强制的（plan §11 M1）。改 false 之前先看一遍面板。
#   3. v0.3（issue agent）之后只有 5 类可配项：`labels` / `skills` / `limits` / `agent` / 三个开关
#      （`version` / `enabled` / `dry_run`）+ 可选 `model`。`compliance` / `pipeline` / `prompt` /
#      `commands` / `create_issue` 五段**已整体删除**（`.strict()` 会直接拒收）。
#   4. 两处**必填**（`repoSettingsSchema` 的 superRefine）：`agent.managers` 必须非空且不重复，
#      `labels.vocabulary[]` 的 `role` 每条都要写，且 `requirement` / `defect` 各至少一个。
#      缺一条，整份配置解析失败（`settings_valid=false`）。
version: 1
enabled: true
dry_run: true
model: anthropic/claude-sonnet-4

labels:
  # 词表：打标白名单 + 注入提示词的来源（`meaning` 会原样进 prompt）。
  vocabulary:
    - name: bug
      meaning: 明确的缺陷（有复现路径或错误堆栈）
      color: d73a4a
      group: kind
      role: defect
    - name: enhancement
      meaning: 新功能或体验改进
      color: a2eeef
      group: kind
      role: requirement
    - name: question
      meaning: 使用提问，不是缺陷
      color: d876e3
      group: kind
      role: other
    - name: needs-info
      meaning: 缺复现步骤/版本/日志，需要作者补充
      color: fbca04
      role: other
    - name: area/db
      meaning: 涉及数据库层
      role: other
  map:
    bug: bug
    feature: enhancement
    question: question
    docs: documentation
    needs-info: needs-info
    area/db: area/db
  # 白名单：给定时，映射结果不在其中一律不打（防手滑写错标签名）
  allow: [bug, enhancement, question, documentation, needs-info, area/db]
  # 映射到仓库里不存在的标签时：warn（只记日志）/ create（自动建）/ ignore
  missing: warn
  # 一个 issue 上最多打几个（互斥组裁剪之后的硬上限）
  max_per_issue: 6

# issue agent（v0.3 唯一的项目级配置段，`docs/dev-plan-issue-agent.md` §2.6）。
# 刻意没有 `enabled`，也没有任何阈值 —— 事件面由 agent 固定接管，阈值是系统常量。
agent:
  # 管理员 login：`@别名` 提及的**唯一**权限来源，也是「确认类回复等谁」的名单。
  # 必须非空、且不能重复（superRefine 无条件校验）；空 = 整份配置不可用。
  managers: [alice]
  # `issues.opened` / `issues.edited` 要加载的技能 id；写 `null` = 该事件不投递（0 任务）。
  on_opened: format-check
  on_edited: format-check
  # 格式检查通过后是否自动打标签（默认关：v0.3「默认只产出评论」）。
  auto_label_after_format_pass: false
  # 项目级补充提示词（取代 v1.5 的 `prompt_versions` 版本表），上限 4000 字符。
  project_prompt: ''

skills:
  # 项目技能目录开关：`true` = 扫描 `<repo>/.github/pi-bot/skills/`；内置技能恒在。
  project_skills: true

limits:
  max_comments_per_hour: 10
  max_actions_per_run: 8
  max_task_minutes: 20
  concurrency_per_repo: 2
  queue_wait_minutes: 10

# 示例仓库配置：`.github/pi-bot.yml`
#
# 这份文件同时是 doctor / CI 的校验样本（`apps/server/test/skills-registry.test.ts` 会解析它）。
# 三条要点写在这里，改配置的人不必去翻文档：
#   1. `labels.map` 的**值必须是仓库里已经存在的标签**（tech-plan R4：沿用现有标签，不发明新的）；
#      某个判定键没映射，就降级为「只评论不打标」并记 warn。
#   2. `dry_run: true` 是默认值，也是首周强制的（plan §11 M1）。改 false 之前先看一遍面板。
#   3. `compliance.rules` 的 `id` 是 `missing_set_hash` 的输入，**改 id 等于换规则**：
#      同一个 issue 会因此被判成「缺失项变了」，重新催一次。
version: 1
enabled: true
dry_run: true
model: anthropic/claude-sonnet-4

labels:
  map:
    bug: bug
    feature: enhancement
    question: question
    docs: documentation
    needs-info: needs-info
    area/db: area/db
  # 白名单：给定时，映射结果不在其中一律不打（防手滑写错标签名）
  allow: [bug, enhancement, question, documentation, needs-info, area/db]

compliance:
  enabled: true
  rules:
    - id: repro-steps
      description: 复现步骤
    - id: version
      description: 版本号
    - id: logs
      description: 相关日志
      required: false

create_issue:
  enabled: false
  daily_quota: 10
  scenarios: [pr-review]

commands:
  enabled: true
  allowed: [/review-pr, /issue-triage, /issue-repro]
  author_associations: [OWNER, MEMBER, COLLABORATOR]
  allow_users: []
  rate_limit_per_hour: 20

skills:
  repo_skills: true

limits:
  max_comments_per_hour: 10
  max_actions_per_run: 8
  max_task_minutes: 20
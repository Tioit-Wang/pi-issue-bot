<title>Issue 详情 · 固定流水线改造 Demo</title>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="issue-detail" data-crumb="单个 issue">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">

    <main class="page">

        </div>
      </div>

      <div class="stepper" id="d-stepper"></div>

      <div class="grid main-side" style="margin-top:14px">
        <div class="stack">

            <div class="card-head"><h2>阶段时间线<span class="sub">改造新增：阶段 → 任务 → 结论 → 评论</span></h2>

          </div>

        </div>

            <div class="card-head"><h2>元信息</h2></div>

                <button class="btn sm" data-ev="comment" style="justify-content:flex-start">作者补充评论 <span class="spacer"></span><span class="tiny faint">E4 / D8</span></button>
                <button class="btn sm" data-ev="manager" style="justify-content:flex-start">managers 回复 <span class="spacer"></span><span class="tiny faint">Q6 修订</span></button>
                <button class="btn sm" data-ev="next" style="justify-content:flex-start"><code class="inline">/pipeline next</code> <span class="spacer"></span><span class="tiny faint">Q7</span></button>
                <button class="btn sm" data-ev="prev" style="justify-content:flex-start"><code class="inline">/pipeline prev</code> <span class="spacer"></span><span class="tiny faint">Q7</span></button>
                <button class="btn sm" data-ev="recheck" style="justify-content:flex-start"><code class="inline">/recheck</code> <span class="spacer"></span><span class="tiny faint">P6</span></button>

          </div>

          </div>
        </div>
      </div>

<div id="overlays"></div>

<template id="tpl-evidence">
  <div class="stack">
    <div class="notice warn"><span class="n-ico">!</span><div><strong>defect 是正确性校验，不是排版要求</strong>：<code class="inline">verdict.evidence</code> 至少一条 <code class="inline">rule</code> 以 <code class="inline">code:</code> 开头、<code class="inline">quote</code> 命中 <code class="inline">path:line</code> 正则，否则控制面强制降级 <code class="inline">not-found</code>。</div></div>
    <div><div class="strong small" style="margin-bottom:6px">控制面校验三条</div>
      <ol class="small muted" style="padding-left:18px;line-height:1.9;margin:0">
        <li><code class="inline">stage.name</code> 必须等于任务阶段</li>
        <li><code class="inline">result</code> 必须在该阶段允许集合内</li>
        <li><code class="inline">result=defect</code> 时必须有代码证据，否则降级 not-found</li>
      </ol>
    </div>
    <div><div class="strong small" style="margin-bottom:6px">「已查范围」为什么必须落库</div>

    </div>
    <div><div class="strong small" style="margin-bottom:6px">信封（阶段任务只开 comment）</div>
      <pre class="code">{
  "stage": { "name": "classify", "result": "not-found" },
  "verdict": { "labels": [], "evidence": [
    { "rule": "checked:grep", "quote": "src/**/*.ts", "passed": false }
  ] },
  "actions": [{ "intent": "comment", "body": "AI 自由撰写" }],
  "usage": { "inputTokens": 0, "outputTokens": 0, "costUsd": 0 }
}</pre>
    </div>
  </div>
</template>

    render();
  }

  function nowLabel() { return '刚刚（模拟）'; }

  /* ---------- 事件推演 ---------- */
  function pushTl(c, t, b) { S.timeline.push({ c: c, t: t, time: nowLabel(), b: b }); }
  function pushAudit(text) { S.audits.push([nowLabel(), text]); }

  function applyEvent(ev) {
    var st = S.stage + '/' + S.state;
    if (ev === 'comment') {
      if (st !== 'format/awaiting_info') return D.toast('当前状态不适用', '作者补充评论只在 format/awaiting_info 触发重跑', 'warn');
      S.state = 'pending';
      pushTl('done', '作者补充评论 → 立即重跑（评论优先）', '评论内容置顶进 {{body}}（最近 3 条，每条 ≤1000）；锚含 comment id；其后 120s 的 issues.edited 跳过。');
      S.state = 'running';
      S.stage = 'classify'; S.state = 'pending';
      S.infoReq = 'NULL（补充触发后清空）';
      pushTl('done', '格式复查 pass → 一条确认评论（D8）', '「已收到补充信息，格式检查通过。」+ rocket + 入队 pipeline:classify。通过不计入失败次数。');
      S.comments.push({ who: 'pi-bot[bot]', at: nowLabel(), tone: 'success', text: '已收到补充信息，格式检查通过。现在进入分类阶段，我会在容器里核对代码后再给结论。' });
      S.conversation.push({ who: 'zhangwei', at: nowLabel(), text: '（模拟补充）版本号 v2.4.1，导出入口在「报表 → 导出 PDF」，样例已上传。', note: '该评论置顶进 {{body}}，优先于 issue 正文被判定' });
      pushAudit('评论补充 → 重跑格式 → pass（D8 确认）→ classify/pending');
      D.toast('已推演：评论优先 + D8', 'format/awaiting_info → classify/pending，并回一条确认', 'success');
    } else if (ev === 'manager') {
      if (st !== 'classify/awaiting_info') return D.toast('当前状态不适用', 'managers 回复只在 classify/awaiting_info 触发重分类', 'warn');
      S.state = 'pending';
      pushTl('current', 'managers 回复 → 重跑分类', '仅 managers 的普通评论触发；作者 / 他人评论只记录不重跑。锚含 comment id。');
      S.conversation.push({ who: 'wangge', at: nowLabel(), text: '（模拟）任务 id t_6b1e88，容器 docker id 已在 run 详情里，销毁时机是 turn 结束后。', note: 'managers 评论 → 重跑分类' });
      pushAudit('managers 评论 → classify/pending（重分类）');
      D.toast('已推演：重跑分类', 'classify/awaiting_info → classify/pending', 'success');
    } else if (ev === 'next') {
      if (S.state === 'closed') return D.toast('issue 已关闭', 'closed 不再接事件', 'warn');
      if (S.stage === 'format') { S.stage = 'classify'; S.state = 'pending'; }
      else if (S.stage === 'classify') { S.stage = 'agent'; S.state = 'ready'; }
      else if (S.state === 'blocked') { S.state = 'ready'; }
      else { S.state = 'ready'; }
      pushTl('done', '/pipeline next · 进入下一步', '仅 managers；不受 120s 冷却；blocked 时等价解禁并推进；操作记审计（V20）。');
      pushAudit('/pipeline next → ' + S.stage + '/' + S.state);
      D.toast('已推演 /pipeline next', '当前 ' + S.stage + '/' + S.state, 'success');
    } else if (ev === 'prev') {
      if (S.stage === 'agent') { S.stage = 'classify'; S.state = 'pending'; }
      else if (S.stage === 'classify') { S.stage = 'format'; S.state = 'pending'; }
      else return D.toast('已经是最前一步', 'format 没有上一阶段', 'warn');
      pushTl('warn', '/pipeline prev · 返回上一步', '逐步退回：agent/ready → classify/pending（重分类）→ format/pending（重跑格式）；记审计。');
      pushAudit('/pipeline prev → ' + S.stage + '/' + S.state);
      D.toast('已推演 /pipeline prev', '当前 ' + S.stage + '/' + S.state, 'success');
    } else if (ev === 'recheck') {
      if (S.state === 'closed') return D.toast('issue 已关闭', 'closed 不再接事件', 'warn');
      S.state = 'pending';
      pushTl('current', '/recheck · 重跑当前阶段', '锚 pipeline:' + S.stage + ':<issueVersion>；同版本幂等。');
      pushAudit('/recheck → 重跑 ' + S.stage);
      D.toast('已推演 /recheck', S.stage + ' 阶段重新入队', 'success');
    } else if (ev === 'force') {
      if (S.state !== 'blocked') return D.toast('当前未 blocked', '/recheck --force 只用于解禁', 'warn');
      S.state = 'running';
      pushTl('done', '/recheck --force · 解除 blocked', '回到运行态；后续失败仍按「连续 2 次 → blocked」处理。');
      pushAudit('/recheck --force → 解禁');
      D.toast('已推演 /recheck --force', 'blocked → running', 'success');
    }
    render();
  }

  /* ---------- 渲染 ---------- */
  function render() {
    document.getElementById('d-title').innerHTML = '<span class="mono small muted">issue#' + num + '</span> &nbsp;' + esc(base.title);
    document.getElementById('d-desc').textContent = base.desc;
    document.title = 'issue#' + num + ' · 固定流水线改造 Demo';

    document.getElementById('d-state-badge').textContent = S.stage + '/' + S.state;
    document.getElementById('d-state-badge').className = 'badge ' + TONE[S.state] + ' mono';

    /* stepper */
    var order = ['format', 'classify', 'agent'];
    var idx = order.indexOf(S.stage);
    document.getElementById('d-stepper').innerHTML = order.map(function (s, i) {
      var cls = S.stage === 'closed' ? 'done' : idx > i ? 'done' : idx === i ? (S.state === 'awaiting_info' || S.state === 'blocked' ? 'blocked' : 'current') : '';
      var label = S.stage === 'closed' ? '已完成' : idx > i ? '通过' : idx === i ? (S.state === 'awaiting_info' ? '等待中' : S.state === 'blocked' ? '已阻塞' : S.state === 'ready' ? '已就绪' : S.state) : '未开始';
      return '<div class="step ' + cls + '"><div class="s-top"><span class="s-idx">' + i + '</span>' +
        '<span class="s-name">阶段 ' + i + ' · ' + STAGE_NAME[s] + '</span>' +
        '<span class="s-state"><span class="badge ' + (cls === 'done' ? 'success' : cls === 'blocked' ? 'warn' : cls === 'current' ? 'brand' : 'neutral') + '">' + label + '</span></span></div>' +
        '<div class="s-desc">' + (i === 0 ? 'light · 格式检查 · 项目版提示词 + AGENTS.md' : i === 1 ? 'sandboxed · 容器内验真 · path:line 证据' : 'persistent · 会话复用 · 四层提示词') + '</div>' +
        '<div class="s-meta">pipeline:' + (i === 0 ? 'format' : i === 1 ? 'classify' : 'mention') + ' · ' + (i === 2 ? 'session ' + base.session : 'ephemeral') + '</div></div>';
    }).join('');

    /* timeline */
    document.getElementById('d-timeline').innerHTML = S.timeline.map(function (t) {
      return '<div class="tl-item ' + t.c + '"><div class="tl-head"><span class="tl-title">' + esc(t.t) + '</span>' +
        '<span class="tl-time mono">' + esc(t.time) + '</span></div><div class="tl-body">' + t.b + '</div></div>';
    }).join('');

    /* 分类结论 */
    var c = S.conclusion;
    var kindBadge = { 'not-found': 'warn', defect: 'info', format: 'neutral', closed: 'danger', blocked: 'danger' }[c.kind] || 'neutral';
    var html = '<div class="row" style="margin-bottom:10px"><span class="badge ' + kindBadge + ' mono">result = ' + esc(c.kind) + '</span>' +
      '<span class="small muted">' + esc(c.text) + '</span></div>';
    if (c.evidence) {
      html += '<div class="strong small" style="margin:12px 0 6px">代码证据（path:line）</div><div class="evidence">' +
        c.evidence.map(function (e) {
          return '<div class="ev-row"><span class="ev-rule">' + esc(e[0]) + '</span><span class="ev-quote"><a href="runs.html">' + esc(e[1]) + '</a></span>' +
            '<span class="badge success" style="margin-left:auto">passed</span></div>';
        }).join('') + '</div>';
    }
    if (c.checks && c.checks.length) {
      html += '<div class="strong small" style="margin:12px 0 6px">已查范围（同时落 verdict.evidence，rule=checked:…）</div><div class="evidence">' +
        c.checks.map(function (x) { return '<div class="ev-row"><span class="ev-rule">checked</span><span class="ev-quote">' + esc(x) + '</span><span class="badge neutral" style="margin-left:auto">未命中</span></div>'; }).join('') + '</div>';
    }
    html += '<div class="notice ' + (c.kind === 'not-found' ? 'warn' : 'info') + '" style="margin-top:12px"><span class="n-ico">?</span><div><strong>还缺什么</strong><br>' + esc(c.need) + '</div></div>';
    document.getElementById('d-conclusion').innerHTML = html;

    /* 评论 */
    document.getElementById('d-comments').innerHTML = S.comments.map(function (m) {
      return '<div style="border:1px solid var(--border);border-left:3px solid var(--' + (m.tone === 'danger' ? 'danger' : m.tone === 'warn' ? 'warn' : m.tone === 'success' ? 'success' : 'info') + ');border-radius:6px;padding:11px 13px;margin-bottom:10px">' +
        '<div class="row between" style="margin-bottom:6px"><span class="mono small strong">' + esc(m.who) + '</span><span class="tiny faint mono">' + esc(m.at) + '</span></div>' +
        '<div class="small" style="white-space:pre-wrap;line-height:1.75">' + esc(m.text) + '</div>' +
        '<div class="tiny faint" style="margin-top:8px">AI 撰写 · 控制面仅追加 /cc 与长度/频率限制（Q8）</div></div>';
    }).join('');

    /* 对话 */
    document.getElementById('d-conversation').innerHTML = S.conversation.map(function (m) {
      return '<div class="row" style="align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)">' +
        '<span class="dot ' + (m.who.indexOf('bot') >= 0 ? 'brand' : 'neutral') + '" style="margin-top:6px"></span>' +
        '<div style="flex:1;min-width:0"><div class="row"><span class="mono tiny strong">' + esc(m.who) + '</span><span class="tiny faint mono">' + esc(m.at) + '</span></div>' +
        '<div class="small" style="margin-top:3px">' + esc(m.text) + '</div>' +
        (m.note ? '<div class="tiny faint" style="margin-top:4px">↳ ' + esc(m.note) + '</div>' : '') + '</div></div>';
    }).join('');

    /* 元信息 */
    var meta = [
      ['编号', 'issue#' + num], ['阶段', S.stage], ['状态', S.state], ['类别', S.category],
      ['format_fail_count', S.fail + ' / 5'], ['停留时长', S.dwell], ['等待对象', S.stage === 'format' && S.state === 'awaiting_info' ? '作者' : S.stage === 'classify' && S.state === 'awaiting_info' ? '管理员' : S.state === 'blocked' ? '维护者' : '—'],
      ['info_requested_at', S.infoReq], ['mention', S.mention], ['会话', base.session], ['运行时', base.mode]
    ];
    document.getElementById('d-meta').innerHTML = '<dl style="display:grid;grid-template-columns:1fr 1fr;gap:9px 10px;margin:0;font-size:11.5px">' +
      meta.map(function (p) { return '<div style="min-width:0"><dt class="tiny faint">' + esc(p[0]) + '</dt><dd class="mono small truncate" style="margin:2px 0 0" title="' + esc(p[1]) + '">' + esc(p[1]) + '</dd></div>'; }).join('') + '</dl>' +
      '<div class="notice" style="margin-top:12px"><span class="n-ico">◇</span><div>数据来自 <code class="inline">issue_pipeline</code> + <code class="inline">envelopes.stage_name/stage_result</code>，不需要解 JSONB。</div></div>';

    /* 审计 */
    document.getElementById('d-audit').innerHTML = S.audits.map(function (a) {
      return '<div class="row" style="gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">' +
        '<span class="tiny faint mono" style="width:76px;flex:none">' + esc(a[0]) + '</span>' +
        '<span class="small">' + esc(a[1]) + '</span></div>';
    }).join('');

    /* 提示词装配 */
    var layers = [
      ['阶段系统提示词', S.stage === 'format' ? 'format_check · 项目版 v3' : S.stage === 'classify' ? 'classify · 系统默认 v0' : 'agent · 系统默认 v0'],
      ['P1 用户设定提示词', S.stage === 'agent' ? 'project · 项目版 v2' : '不注入'],
      ['AGENTS.md', '是（Q9：任意时刻生效）'],
      ['技能层', S.stage === 'agent' ? '是' : '不注入'],
      ['输出契约', '是（代码追加，不可配）']
    ];
    document.getElementById('d-layers').innerHTML = layers.map(function (l) {
      return '<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--border)"><span class="small muted">' + esc(l[0]) + '</span><span class="badge ' + (l[1].indexOf('不注入') >= 0 ? 'neutral' : 'brand') + ' mono">' + esc(l[1]) + '</span></div>';
    }).join('') + '<div class="tiny faint" style="margin-top:8px">阶段 0/1 的最终 prompt 里 grep 不到 P1 与技能层，但能 grep 到 AGENTS.md（V9）。</div>';
  }

  /* ---------- 绑定 ---------- */
  document.getElementById('simulator').addEventListener('click', function (e) {
    var b = e.target.closest('[data-ev]'); if (!b) return;
    var ev = b.getAttribute('data-ev');
    var st = S.stage + '/' + S.state;
    var needConfirm = ev === 'next' || ev === 'prev' || ev === 'force';
    var msgs = {
      next: ['模拟 /pipeline next', '当前 <strong>' + esc(st) + '</strong>。执行后进入下一阶段；blocked 时等价解禁。仅 managers 可用，不受 120s 冷却，操作记审计。'],
      prev: ['模拟 /pipeline prev', '当前 <strong>' + esc(st) + '</strong>。执行后逐步退回上一阶段并重跑。仅 managers 可用，操作记审计。'],
      force: ['模拟 /recheck --force', '解除 <strong>blocked</strong> 并回到运行态。真实环境需发在 issue 评论里。']
    };
    if (needConfirm) D.confirm(msgs[ev][0], msgs[ev][1], function () { applyEvent(ev); }, '模拟执行');
    else applyEvent(ev);
  });
  document.getElementById('reset-sim').addEventListener('click', function () {
    reset(); D.toast('演示已重置', '回到 issue#' + num + ' 的初始状态');
  });
  document.getElementById('copy-link').addEventListener('click', function () {
    D.copy(location.href.split('?')[0] + '?n=' + num);
  });

  reset();
})();
</script>
</body>
</html>
